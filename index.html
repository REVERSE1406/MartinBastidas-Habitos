<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Martín Bastidas - Tablero de Hábitos</title>
    <!-- Integración de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5" style="max-width: 600px">
      <h1 class="text-center mb-4 text-primary">Tablero de Hábitos</h1>

      <!-- Formulario base -->
      <form id="form-habito" class="d-flex gap-2 mb-4">
        <input
          type="text"
          id="input-habito"
          class="form-control"
          placeholder="Nuevo hábito (ej. Leer 20 min)"
          required
          autocomplete="off"
        />
        <button type="submit" class="btn btn-primary">Agregar</button>
      </form>

      <!-- Lista vacía requerida en Sesión 1 -->
      <ul id="lista-habitos" class="list-group">
        <!-- Los hábitos se inyectarán aquí -->
      </ul>
    </div>
  </body>
</html>
